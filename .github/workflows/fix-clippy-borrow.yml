name: fix-clippy-borrow

on:
  push:
    branches:
      - devin-supervisor-validation-fmt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: devin-supervisor-validation-fmt
          fetch-depth: 0
      - name: Apply final strict clippy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/tools.rs')
          text = path.read_text()
          old = 'crate::devin::process_tools(enabled, &supervisor, &policy)'
          new = 'crate::devin::process_tools(enabled, &supervisor, policy)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-clippy-borrow.yml
          git add src/tools.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(devin): remove redundant policy borrow"
          git push origin HEAD:devin-supervisor-validation-fmt
